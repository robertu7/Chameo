name: ChameoMobile
options:
  bundleIdPrefix: com.robertu
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  defaultConfig: Debug
configs:
  Debug: debug
  Release: release
packages:
  ChameoCore:
    path: ..
targets:
  ChameoMobile:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
        excludes:
          - Info.plist
      - path: ../Sources/Chameo/Resources/Localization
        buildPhase: resources
      - path: ../Sources/Chameo/Resources/Onboarding
        buildPhase: resources
    dependencies:
      - package: ChameoCore
        product: ChameoCore
    preBuildScripts:
      - name: Stage iOS App Icon
        script: |
          /bin/cp "${SRCROOT}/../Assets/AppIconSource.png" "${SRCROOT}/Resources/Assets.xcassets/AppIcon.appiconset/AppIconSource.png"
          /bin/cp "${SRCROOT}/../Assets/AppIconSource.png" "${SRCROOT}/Resources/Assets.xcassets/LaunchIcon.imageset/LaunchIcon.png"
          /usr/bin/sips -z 512 512 "${SRCROOT}/Resources/Assets.xcassets/LaunchIcon.imageset/LaunchIcon.png" >/dev/null
        basedOnDependencyAnalysis: false
    configFiles:
      Debug: Config/Version.xcconfig
      Release: Config/Version.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robertu.Chameo
        PRODUCT_NAME: Chameo
        PRODUCT_MODULE_NAME: ChameoMobile
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: "\"Preview Content\""
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    scheme:
      testTargets:
        - ChameoMobileTests
        - ChameoMobileUITests
  ChameoMobileTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests
    dependencies:
      - target: ChameoMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robertu.Chameo.mobile-tests
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Chameo.app/Chameo"
        BUNDLE_LOADER: "$(TEST_HOST)"
  ChameoMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: UITests
    dependencies:
      - target: ChameoMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robertu.Chameo.mobile-ui-tests
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ChameoMobile
