name: Release
run-name: Release ${{ inputs.release_tag || github.ref_name }}

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable release tag to publish or recover
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: macos-26
    environment: release
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Select release tag
        id: release
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$INPUT_RELEASE_TAG"
          else
            release_tag="$GITHUB_REF_NAME"
          fi
          if [[ "$release_tag" != v* ]]; then
            echo "Release tag must start with v." >&2
            exit 1
          fi
          echo "tag=$release_tag" >>"$GITHUB_OUTPUT"

      - name: Check out workflow tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          path: tooling

      - name: Check out tagged release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ steps.release.outputs.tag }}
          path: release-source

      - name: Verify release version and source branch
        working-directory: release-source
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch origin main
          ./script/verify_release_version.sh "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"

      - name: Resolve pinned dependencies
        working-directory: release-source
        run: swift package resolve

      - name: Run tests
        working-directory: release-source
        run: swift test

      - name: Run strict concurrency build
        working-directory: release-source
        run: swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warn-concurrency

      - name: Build ad-hoc release bundle
        working-directory: release-source
        env:
          CHAMEO_CODE_SIGN_IDENTITY: "-"
        run: |
          export CHAMEO_BUILD_ID CHAMEO_BUILD_NUMBER
          CHAMEO_BUILD_ID="$(git rev-parse --short=12 HEAD)"
          CHAMEO_BUILD_NUMBER="$(git rev-list --count HEAD)"
          ./script/build_app.sh --release

      - name: Prepare Sparkle private key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "The release environment is missing SPARKLE_PRIVATE_KEY." >&2
            exit 1
          fi
          umask 077
          printf '%s' "$SPARKLE_PRIVATE_KEY" >"$RUNNER_TEMP/sparkle-private-key"

      - name: Fetch existing appcast
        run: |
          mkdir -p release-source/dist/updates
          status="$(
            curl -sS -L \
              -o release-source/dist/updates/appcast.xml \
              -w '%{http_code}' \
              https://robertu7.github.io/Chameo/appcast.xml
          )"
          if [[ "$status" != "200" && "$status" != "404" ]]; then
            echo "Unable to fetch existing appcast: HTTP $status" >&2
            exit 1
          fi
          if [[ "$status" == "404" ]]; then
            rm -f release-source/dist/updates/appcast.xml
          fi

      - name: Sign and validate release artifacts
        working-directory: release-source
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SPARKLE_PRIVATE_KEY_FILE: ${{ runner.temp }}/sparkle-private-key
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            cp "$GITHUB_WORKSPACE/tooling/script/prepare_release.sh" script/prepare_release.sh
          fi
          ./script/prepare_release.sh "${RELEASE_TAG#v}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Stage Pages content
        working-directory: release-source
        run: |
          mkdir -p dist/pages
          cp dist/updates/appcast.xml dist/pages/appcast.xml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: release-source/dist/pages

      - name: Publish GitHub release
        working-directory: tooling
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          source script/version.sh
          version="${RELEASE_TAG#v}"
          archive="../release-source/dist/updates/Chameo-$version-arm64.zip"
          disk_image="../release-source/dist/releases/Chameo-$version-arm64.dmg"
          notes_asset="../release-source/dist/updates/Chameo-$version-arm64.md"
          release_flags=()
          if is_chameo_prerelease "$version"; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            "$archive" \
            "$disk_image" \
            "$notes_asset" \
            "${release_flags[@]}" \
            --title "Chameo $version" \
            --notes-file "$notes_asset" \
            --verify-tag

      - name: Validate published release URLs
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          base="https://github.com/robertu7/Chameo/releases/download/$RELEASE_TAG"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 2 \
            --output /dev/null "$base/Chameo-$version-arm64.zip"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 2 \
            --output /dev/null "$base/Chameo-$version-arm64.dmg"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 2 \
            --output /dev/null "$base/Chameo-$version-arm64.md"

  deploy-feed:
    name: Publish signed appcast
    needs: release
    runs-on: macos-26
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: Validate published appcast URL
        run: |
          curl --fail --silent --show-error --location \
            --retry 10 --retry-delay 3 \
            --output /dev/null \
            "${{ steps.deployment.outputs.page_url }}appcast.xml"
