name: Repair update feed

on:
  workflow_dispatch:
    inputs:
      feed_sha256:
        description: SHA-256 of the current public appcast to re-sign
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: chameo-update-feed
  cancel-in-progress: false

jobs:
  sign-feed:
    name: Re-sign the existing appcast
    runs-on: macos-26
    environment: release
    permissions:
      contents: read
      pages: write
    outputs:
      feed_sha256: ${{ steps.feed.outputs.sha256 }}
    steps:
      - name: Check out feed tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve pinned Sparkle tools
        run: swift package resolve

      - name: Re-sign and verify the diagnosed feed
        id: feed
        env:
          EXPECTED_FEED_SHA256: ${{ inputs.feed_sha256 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_FEED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ -n "$SPARKLE_PRIVATE_KEY" ]]
          mkdir -p "$RUNNER_TEMP/repaired-feed"
          appcast="$RUNNER_TEMP/repaired-feed/appcast.xml"
          curl --fail --silent --show-error --location \
            https://robertu7.github.io/Chameo/appcast.xml --output "$appcast"
          actual_sha256="$(shasum -a 256 "$appcast" | awk '{print $1}')"
          if [[ "$actual_sha256" != "$EXPECTED_FEED_SHA256" ]]; then
            echo "The public feed changed since diagnosis; refusing to overwrite it." >&2
            exit 1
          fi
          umask 077
          key_file="$RUNNER_TEMP/feed-signing-key"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$SPARKLE_PRIVATE_KEY" >"$key_file"
          sign_update=".build/artifacts/sparkle/Sparkle/bin/sign_update"
          "$sign_update" --ed-key-file "$key_file" "$appcast"
          "$sign_update" --verify --ed-key-file "$key_file" "$appcast"
          swift script/verify_appcast.swift "$appcast"
          /usr/bin/xmllint --noout "$appcast"
          echo "sha256=$(shasum -a 256 "$appcast" | awk '{print $1}')" >>"$GITHUB_OUTPUT"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload repaired feed
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ runner.temp }}/repaired-feed

  deploy-feed:
    name: Publish and verify repaired appcast
    needs: sign-feed
    runs-on: macos-26
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out feed verification tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Deploy repaired feed
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: Verify the public feed signature and deployed bytes
        env:
          EXPECTED_FEED_SHA256: ${{ needs.sign-feed.outputs.feed_sha256 }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location \
            --retry 10 --retry-delay 3 \
            --output "$RUNNER_TEMP/appcast.xml" \
            "${PAGE_URL}appcast.xml?deployment=${{ github.run_id }}"
          swift script/verify_appcast.swift "$RUNNER_TEMP/appcast.xml"
          test "$(shasum -a 256 "$RUNNER_TEMP/appcast.xml" | awk '{print $1}')" = "$EXPECTED_FEED_SHA256"
